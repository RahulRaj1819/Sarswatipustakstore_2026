services:
  # Static Site for Render (Fast, global CDN, free SSL)
  - type: web
    name: sarswati-pustak-bhandar
    runtime: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
